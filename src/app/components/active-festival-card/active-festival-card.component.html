<section class="active-festival-card" aria-label="Current festival schedule">
  <div class="active-festival-card__heading">
    <span><i aria-hidden="true"></i> LIVE NOW</span>
    <p>{{ formatDay(currentSet()?.day ?? nextSet()?.day ?? festival().startDate) }}</p>
  </div>

  <div class="active-festival-card__festival">
    <h2>
      <button class="active-festival-card__title" type="button" (click)="viewDetails.emit()">
        {{ festival().title }}
      </button>
    </h2>
    <p class="active-festival-card__location">{{ festival().location }}</p>
  </div>

  <div class="active-festival-card__sets">
    <button class="active-festival-card__set" type="button" aria-label="Open set times for now playing" (click)="viewLineup.emit(currentSet()?.day ?? festival().startDate)">
      <p>NOW PLAYING</p>
      @if (currentSet(); as set) {
        <strong>
          {{ set.artist }}
          @if (set.isMustSee) {
            <ion-icon name="heart" aria-label="Must-see"></ion-icon>
          }
        </strong>
        <span>{{ set.stage || 'Stage to be confirmed' }}</span>
        <span>{{ formatSetTime(set) }}</span>
        @if (currentSetCount() > 1) {
          <small>+ {{ currentSetCount() - 1 }} clash{{ currentSetCount() === 2 ? '' : 'es' }}</small>
        }
      } @else {
        <strong>Nothing scheduled</strong>
        <span>Take a breather — the next set is below.</span>
      }
    </button>

    <button class="active-festival-card__set" type="button" aria-label="Open set times for up next" (click)="viewLineup.emit(nextSet()?.day ?? festival().startDate)">
      <p>UP NEXT</p>
      @if (nextSet(); as set) {
        <strong>
          {{ set.artist }}
          @if (set.isMustSee) {
            <ion-icon name="heart" aria-label="Must-see"></ion-icon>
          }
        </strong>
        <span>{{ set.stage || 'Stage to be confirmed' }}</span>
        <span>{{ formatSetTime(set) }}</span>
        @if (nextSetCount() > 1) {
          <small>+ {{ nextSetCount() - 1 }} at this time</small>
        }
      } @else {
        <strong>No more sets listed</strong>
        <span>Enjoy the rest of the festival.</span>
      }
    </button>
  </div>

  <div class="active-festival-card__footer" aria-hidden="true"></div>
</section>
