<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      @if (canGoBack() && !isSettings() && !isHelp()) {
        <ion-button aria-label="Go back" (click)="goBack()">
          <ion-icon aria-hidden="true" name="chevron-back"></ion-icon>
        </ion-button>
      }
    </ion-buttons>

    <ion-title>
      @if (showLogo()) {
        <app-rave-route-logo></app-rave-route-logo>
      } @else {
        {{ title() }}
      }
    </ion-title>

    <ion-buttons slot="end">
      @if (!isHome()) {
        <ion-button aria-label="Go home" routerLink="/home">
          <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
        </ion-button>
      }
      <ion-button
        #menuTrigger
        aria-label="Open app menu"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        (click)="toggleMenu()"
      >
        <ion-icon aria-hidden="true" name="menu-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

@if (menuOpen()) {
  <div #menu animate.leave="rr-menu-leave" class="app-header-menu rr-motion-enter" role="menu" aria-label="App menu" (keydown)="handleMenuKeydown($event)" (focusout)="handleMenuFocusout($event)">
    @if (isHelp()) {
      <button role="menuitem" tabindex="-1" type="button" (click)="openHelp()">
        <ion-icon aria-hidden="true" name="close"></ion-icon>
        Close help
      </button>
    } @else {
      <button role="menuitem" tabindex="-1" type="button" routerLink="/help" (click)="closeMenu()">
        <ion-icon aria-hidden="true" name="help-circle-outline"></ion-icon>
        Help
      </button>
    }
    @if (isSettings()) {
      <button role="menuitem" tabindex="-1" type="button" (click)="openSettings()">
        <ion-icon aria-hidden="true" name="close"></ion-icon>
        Close settings
      </button>
    } @else {
      <button role="menuitem" tabindex="-1" type="button" routerLink="/settings" (click)="closeMenu()">
        <ion-icon aria-hidden="true" name="settings-outline"></ion-icon>
        Settings
      </button>
    }
  </div>
}
