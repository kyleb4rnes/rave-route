@if (applicationStarted()) {
  @defer (when applicationStarted()) {
    <app-shell [onboardingOpen]="onboardingOpen()"></app-shell>
  }
  @if (onboardingOpen()) {
    <app-onboarding [ready]="true"></app-onboarding>
  }
} @else if (onboardingOpen()) {
  <app-onboarding [ready]="false"></app-onboarding>
} @else {
  <section class="launch-screen" aria-label="Loading Rave Route" aria-live="polite" role="status">
    <div class="launch-screen__backdrop" aria-hidden="true"></div>
    <div class="launch-screen__content">
      <img class="launch-screen__logo" src="assets/brand/rave-route-logo-red-light.svg" alt="Rave Route" />
      <span class="launch-screen__spinner" aria-hidden="true"></span>
    </div>
  </section>
}
