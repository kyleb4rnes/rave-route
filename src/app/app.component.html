@if (applicationStarted()) {
  @defer (when applicationStarted()) {
    <app-shell [onboardingOpen]="onboardingOpen()" (ready)="shellReady.set(true)"></app-shell>
  }
  @if (onboardingOpen()) {
    <app-onboarding [ready]="true"></app-onboarding>
  }
}

@if (!onboardingOpen() && (!applicationStarted() || launchState() !== 'complete')) {
  <section
    class="launch-screen"
    [class.launch-screen--leaving]="launchState() === 'leaving'"
    (animationend)="completeLaunch($event)"
    [style.--launch-colour]="theme().primary"
    aria-label="Loading Rave Route"
    aria-live="polite"
    role="status"
  >
    <div class="launch-screen__backdrop" aria-hidden="true"></div>
    <div class="launch-screen__content">
      <app-rave-route-logo variant="launch"></app-rave-route-logo>
      <span class="launch-screen__spinner" aria-label="Loading your festival route" role="img"></span>
    </div>
  </section>
} @else if (!applicationStarted() && onboardingOpen()) {
  <app-onboarding [ready]="false"></app-onboarding>
}
