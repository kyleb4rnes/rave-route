<ion-app [style.--rr-app-background]="appBackground()">
  <ion-router-outlet [class.app-router-outlet--hidden]="hideRoutedContent()"></ion-router-outlet>

  @if (launchScreenVisible()) {
    <section
      class="launch-screen"
      [class.launch-screen--leaving]="launchState() === 'leaving'"
      aria-label="Loading Rave Route"
      aria-live="polite"
      role="status"
    >
      <div class="launch-screen__backdrop" aria-hidden="true"></div>
      <div class="launch-screen__content">
        <app-rave-route-logo variant="launch"></app-rave-route-logo>
        <ion-spinner aria-label="Loading your festival route" name="crescent"></ion-spinner>
      </div>
    </section>
  }

  @if (onboardingOpen()) {
    <app-onboarding [ready]="onboardingReady()"></app-onboarding>
  }
</ion-app>
